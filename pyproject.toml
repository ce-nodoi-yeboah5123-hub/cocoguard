[project]
name = "cocoguard"
version = "1.0.0"
requires-python = ">=3.12"

dependencies = [
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.1.1",
    "python-dotenv==1.2.3",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "pyodbc==5.3.0",
    "numpy==2.5.2",
    "pillow==12.3.0",
    "ultralytics==8.4.129"
]

[tool.vercel]
entrypoint = "run:app"
